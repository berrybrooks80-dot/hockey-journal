<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ice Hockey Training Journal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C4001E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hockey Journal">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700;900&display=swap">
<style>
:root{--nf:"Noto Sans KR",system-ui,-apple-system,sans-serif;--nfs:18px;--paper:#FFFFFF;--desk:#EFECE6;--ink:#1A1A1A;--muted:#6B6B6B;--rule:#3A3A3A;--soft:#D9D5CE;--red:#C4001E;--pen-blue:#1C4FB8;--crease:#E3E3E3;--shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#17191C;--desk:#0D0E10;--ink:#ECECEC;--muted:#9A9A9A;--rule:#6A6A6A;--soft:#2C2F33;--red:#E0263F;--pen-blue:#7FA6F0;--crease:#33373C;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#17191C;--desk:#0D0E10;--ink:#ECECEC;--muted:#9A9A9A;--rule:#6A6A6A;--soft:#2C2F33;--red:#E0263F;--pen-blue:#7FA6F0;--crease:#33373C;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.serif{font-family:"Noto Serif KR","Times New Roman",serif}
/* cover */
.cover{background:#C4001E;color:#fff;text-align:center;padding:34px 20px 30px;position:relative}
.cover .school{margin:0;font-family:"Noto Serif KR","Times New Roman",serif;font-weight:700;font-size:11px;letter-spacing:.18em;opacity:.92}
.cover .seal{width:96px;height:auto;display:block;margin:18px auto 16px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.cover h1{margin:0;font-family:"Noto Serif KR","Times New Roman",serif;font-weight:900;font-size:24px;line-height:1.18;letter-spacing:.04em}
.cover .year{margin:12px 0 0;font-size:12px;letter-spacing:.3em;opacity:.85}
.home{max-width:640px;margin:0 auto;padding-bottom:110px}
.sheet{background:var(--paper);margin:-14px 14px 0;border-radius:6px;box-shadow:var(--shadow);padding:20px 18px 18px;position:relative}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:6px}
.sum div{text-align:center}.sum div+div{border-left:1px solid var(--soft)}
.sum b{display:block;font-family:"Noto Serif KR",serif;font-size:28px;line-height:1.1}
.sum span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--soft);cursor:pointer}
.list li:last-child{border-bottom:0}
.dt{text-align:center;border-right:2px solid var(--red);padding-right:10px}
.dt b{display:block;font-family:"Noto Serif KR",serif;font-size:24px;line-height:1}
.dt span{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.lm strong{display:block;font-weight:500;line-height:1.35}
.lm span{font-size:13px;color:var(--muted)}
.chip{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:34px 8px 26px;font-size:15px}
.empty b{display:block;font-family:"Nanum Pen Script",cursive;font-size:30px;color:var(--ink);font-weight:400;margin-bottom:4px}
.backup{display:flex;gap:8px;justify-content:center;margin-top:18px}
.backup button,.bar button{background:none;border:1px solid var(--soft);border-radius:8px;padding:7px 12px;font-size:13px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#C4001E;color:#fff;border:0;border-radius:999px;padding:15px 30px;font-weight:700;font-size:16px;box-shadow:0 8px 22px rgba(196,0,30,.35);z-index:5}
/* editor */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--soft);display:flex;align-items:center;gap:10px;padding:10px 14px}
.bar .st{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.bar .go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.page{background:var(--paper);max-width:900px;margin:14px auto 0;padding:26px 18px 30px;box-shadow:var(--shadow);position:relative}
.pseal{position:absolute;top:22px;right:18px;width:62px;height:auto}
.hdr{margin-right:76px}
.hl{display:flex;gap:10px;border-bottom:1px solid var(--rule);padding:8px 0 2px;min-height:44px;align-items:flex-end}
.hl input,.hl select{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:4px 0}
.hl select{flex:0 0 auto}
.hl input::placeholder,.drill .dh input::placeholder{color:var(--muted);opacity:.7}
.hl .topic{font-family:"Noto Serif KR",serif;font-weight:700;font-size:19px}
.drill{margin-top:30px}
.dh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.dn{font-family:"Noto Serif KR",serif;font-weight:900;font-size:13px;letter-spacing:.14em;color:var(--red);white-space:nowrap}
.dh input{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--soft);background:none;color:var(--ink);font:inherit;font-family:var(--nf);font-size:max(16px,calc(var(--nfs) - 2px));padding:2px 0}
.dwrap{display:grid;gap:14px}
@media (min-width:720px){.dwrap{grid-template-columns:3fr 2fr;align-items:start}.page{padding:36px 40px 40px}.pseal{width:78px;top:30px;right:40px}.hdr{margin-right:100px}}
.rink{position:relative;aspect-ratio:200/113;width:100%}
.rink canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:13%/23%}
.rink.on canvas{touch-action:none;box-shadow:0 0 0 2px var(--red)}
.pen{position:absolute;right:8px;bottom:8px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:13px}
.rink.on .pen{display:none}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tools button{border:1px solid var(--soft);background:var(--paper);border-radius:8px;padding:6px 10px;font-size:13px}
.tools button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw{width:30px;height:30px;padding:0!important;border-radius:50%!important}
.tools .done{margin-left:auto;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.notes{--lh:34px;display:block;width:100%;min-height:calc(var(--lh)*6 + 4px);border:0;resize:none;background:transparent;color:var(--ink);font-family:var(--nf);font-size:var(--nfs);line-height:var(--lh);padding:0 2px;
background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh));background-size:100% var(--lh);background-attachment:local;overflow:hidden}
.notes::placeholder{color:var(--muted);opacity:.6}
.brand{margin-top:34px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.05}
.brand small{font-size:10px;letter-spacing:.06em}
.brand b{font-family:"Noto Serif KR",serif;font-weight:900;font-size:17px;letter-spacing:.02em}
.del{display:block;margin:20px auto 120px;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.pname{margin:0 0 8px;font-family:"Noto Serif KR","Times New Roman",serif;font-weight:900;font-size:28px;letter-spacing:.06em;line-height:1.2}
.pname span{font-size:.75em;opacity:.85;margin-left:4px}
.player{display:grid;grid-template-columns:1fr 92px;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--soft)}
.player label{font-size:12px;color:var(--muted)}
.player input{display:block;width:100%;margin-top:4px;border:0;border-bottom:1px solid var(--rule);background:none;color:var(--ink);font:inherit;font-size:16px;padding:4px 0}
.fonts{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 0;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--soft);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;font-size:15px}
.seg button+button{border-left:1px solid var(--soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bar select{border:1px solid var(--soft);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:13px;padding:7px 6px}
.install{display:block;margin:14px auto 0;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:9px 16px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head>

/* rink drawing */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function col(c){return c==='r'?css('--red'):c==='b'?css('--pen-blue'):css('--ink');}
function drawRink(x,X,Y,W,ink,gray){var s=W/200,H=113*s;x.save();x.translate(X,Y);x.strokeStyle=ink;x.fillStyle=ink;x.lineCap='butt';
function L(a,b,c,d,w){x.lineWidth=w*s;x.beginPath();x.moveTo(a*s,b*s);x.lineTo(c*s,d*s);x.stroke();}
x.save();x.beginPath();if(x.roundRect)x.roundRect(.6*s,.6*s,W-1.2*s,H-1.2*s,26*s);else x.rect(.6*s,.6*s,W-1.2*s,H-1.2*s);x.lineWidth=1.1*s;x.stroke();x.clip();
L(14,0,14,113,.45);L(186,0,186,113,.45);L(68,0,68,113,1.25);L(132,0,132,113,1.25);L(100,0,100,113,1.25);
x.lineWidth=.5*s;x.beginPath();x.arc(100*s,56.5*s,16*s,0,Math.PI*2);x.stroke();
x.beginPath();x.arc(100*s,0,10*s,0,Math.PI);x.stroke();
[[14,-Math.PI/2,Math.PI/2],[186,Math.PI/2,Math.PI*1.5]].forEach(function(c){x.beginPath();x.moveTo(c[0]*s,50.5*s);x.arc(c[0]*s,56.5*s,6*s,c[1],c[2]);x.closePath();x.fillStyle=gray;x.fill();x.lineWidth=.45*s;x.stroke();});
x.fillStyle=ink;[[73,31],[127,31],[73,82],[127,82],[36,31],[36,82],[164,31],[164,82],[100,56.5]].forEach(function(p){x.beginPath();x.arc(p[0]*s,p[1]*s,(p[0]===100?.6:1.3)*s,0,Math.PI*2);x.fill();});
[36,164].forEach(function(cx){[31,82].forEach(function(cy){[-1,1].forEach(function(sx){[-1,1].forEach(function(sy){L(cx+sx*2,cy+sy*2.4,cx+sx*8.5,cy+sy*2.4,.4);L(cx+sx*2,cy+sy*2.4,cx+sx*2,cy+sy*6.5,.4);});});});
[[cx-3,12,16],[cx+3,12,16],[cx-3,43,47],[cx+3,43,47],[cx-3,66,70],[cx+3,66,70],[cx-3,97,101],[cx+3,97,101]].forEach(function(t){L(t[0],t[1],t[0],t[2],.45);});});
x.restore();x.restore();}
function drawStroke(x,st,W,H,lw,color){var p=st.p;if(p.length<2)return;x.strokeStyle=color;x.fillStyle=color;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(p[0][0]*W,p[0][1]*H);
for(var i=1;i<p.length-1;i++){var mx=(p[i][0]+p[i+1][0])/2*W,my=(p[i][1]+p[i+1][1])/2*H;x.quadraticCurveTo(p[i][0]*W,p[i][1]*H,mx,my);}
var e=p[p.length-1];x.lineTo(e[0]*W,e[1]*H);x.stroke();
if(st.a){var j=p.length-2,ex=e[0]*W,ey=e[1]*H;while(j>0&&Math.hypot(ex-p[j][0]*W,ey-p[j][1]*H)<lw*5)j--;var ang=Math.atan2(ey-p[j][1]*H,ex-p[j][0]*W),hl=lw*4.2;
x.beginPath();x.moveTo(ex,ey);x.lineTo(ex-hl*Math.cos(ang-.45),ey-hl*Math.sin(ang-.45));x.lineTo(ex-hl*Math.cos(ang+.45),ey-hl*Math.sin(ang+.45));x.closePath();x.fill();}}
function cvs(i){return app.querySelector('.rink[data-i="'+i+'"] canvas');}
function redraw(i){var cv=cvs(i);if(!cv||!cur)return;var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,W=r.width,H=r.height;if(!W)return;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);var x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
drawRink(x,0,0,W,css('--rule')||'#333',css('--crease'));var lw=Math.max(2,W*.0075);cur.drills[i].s.forEach(function(st){drawStroke(x,st,W,H,lw,col(st.c));});}
function setupRink(i){var cv=cvs(i);redraw(i);
function pt(e){var r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)/r.width*10000)/10000,Math.round((e.clientY-r.top)/r.height*10000)/10000];}
cv.addEventListener('pointerdown',function(e){if(drawIdx!==i)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(x){}active={c:tool.c,a:tool.a,p:[pt(e)]};cur.drills[i].s.push(active);});
cv.addEventListener('pointermove',function(e){if(!active||drawIdx!==i)return;e.preventDefault();var p=pt(e),l=active.p[active.p.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<.004)return;active.p.push(p);
 var r=cv.getBoundingClientRect(),x=cv.getContext('2d');x.strokeStyle=col(active.c);x.lineWidth=Math.max(2,r.width*.0075);x.lineCap='round';x.beginPath();x.moveTo(l[0]*r.width,l[1]*r.height);x.lineTo(p[0]*r.width,p[1]*r.height);x.stroke();});
function end(){if(!active)return;if(active.p.length<2)cur.drills[i].s.pop();active=null;redraw(i);queueSave();}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);}

x.font='700 36px "Noto Serif KR",serif';x.fillText(e.topic||'',86,208);

e.drills.forEach(function(d,i){var y0=360+i*440,rw=620,rh=rw*113/200;
 x.fillStyle=RED;x.font='900 22px "Noto Serif KR",serif';x.fillText('DRILL 0'+(i+1),80,y0-14);x.fillStyle=INK;x.font=FONTS[font].cv.replace(/\d+px/,function(m){return Math.round(parseInt(m)*.85)+'px';});x.fillText(d.t||'',230,y0-14);
 drawRink(x,80,y0,rw,INK,'#E3E3E3');x.save();x.translate(80,y0);d.s.forEach(function(st){drawStroke(x,st,rw,rh,4.6,st.c==='r'?RED:st.c==='b'?'#1C4FB8':INK);});x.restore();
 var nx=750,nw=430,lh=48,top=y0+18;x.strokeStyle=INK;x.lineWidth=1.6;for(var k=1;k<=8;k++){x.beginPath();x.moveTo(nx,top+k*lh);x.lineTo(nx+nw,top+k*lh);x.stroke();}
 x.fillStyle='#1A1A1A';x.font=FONTS[font].cv;wrap(x,d.n,nw-8).slice(0,8).forEach(function(ln,k){x.fillText(ln,nx+4,top+(k+1)*lh-9);});});
x.fillStyle=INK;x.textAlign='center';x.font='400 15px "Noto Sans KR",sans-serif';x.fillText('ICE HOCKEY',150,1652);x.font='900 30px "Noto Serif KR",serif';x.fillText('KYUNG HEE',150,1686);x.font='700 15px "Noto Sans KR",sans-serif';x.fillText('MIDDLE SCHOOL',150,1710);
x.textAlign='right';x.fillStyle='#8A8A8A';x.font='400 18px "Noto Serif KR",serif';x.fillText((player.name?player.name.toUpperCase()+'’S  ':'')+'ICE HOCKEY TRAINING JOURNAL',W-80,1700);

function shareFile(blob,name,title){var f;try{f=new File([blob],name,{type:blob.type});}catch(x){}
if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:title}).catch(function(){});return;}
var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);}
/* events */
app.addEventListener('click',function(ev){var li=ev.target.closest('li[data-id]');if(li){var e=entries.find(function(x){return x.id===li.dataset.id;});if(e)renderEditor(e);return;}
var b=ev.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
if(a==='new'){var ne=newEntry();putE(ne);renderEditor(ne);}
else if(a==='back'){clearTimeout(saveT);if(cur){var c=cur;if(!c.topic&&!c.place&&!c.coach&&c.drills.every(function(d){return!d.t&&!d.n&&!d.s.length;})){entries=entries.filter(function(x){return x!==c;});delE(c.id).then(renderHome);return;}putE(c).finally(renderHome);}else renderHome();}
else if(a==='draw')setDraw(+b.dataset.i);
else if(a==='done')setDraw(-1);

else if(a==='arrow'){tool.a=tool.a?0:1;setDraw(drawIdx);}

 Promise.all(entries.map(putE)).then(function(){renderHome();toast('새 일지 '+add+'개, 업데이트 '+upd+'개를 불러왔어요');});}catch(x){toast('훈련 일지 백업 파일이 아니에요');}};r.readAsText(f);t.value='';});
